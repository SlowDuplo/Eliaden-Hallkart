name: Process hall map PDF

on:
  push:
    branches:
      - main
    paths:
      - "pdf/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-hall-map
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch exhibitor profiles
        env:
          EXHIBITOR_API_URL: https://api.venyou.no/v1/public/widgets/exhibitor-widget/553
        run: >-
          python scripts/fetch_exhibitor_profiles.py
          --api-url "$EXHIBITOR_API_URL"

      - name: Generate map and exhibitor data
        shell: bash
        run: |
          shopt -s nullglob
          pdf_files=(pdf/*.pdf)
          if (( ${#pdf_files[@]} != 1 )); then
            printf 'Expected exactly one PDF directly in pdf/, found %s.\n' "${#pdf_files[@]}" >&2
            exit 1
          fi
          python scripts/process_hall_map.py --pdf "${pdf_files[0]}" --output-dir .

      - name: Commit generated files
        run: |
          git config user.name "turbolego"
          git config user.email "turbolego@gmail.com"
          git add -- assets/hall-map.png data/exhibitors.json data/exhibitor-profiles.json
          if git diff --cached --quiet; then
            echo "Generated hall-map files are unchanged."
            exit 0
          fi
          git commit -m "Regenerate hall map from PDF"
          git push origin HEAD:main
